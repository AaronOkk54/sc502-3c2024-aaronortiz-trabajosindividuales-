<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Registration Form</title>
    
</head>
<link rel="stylesheet" href="form.css">
<body>


<h1>Registration Form</h1>

<p>Please fill out this form with the required information</p>

<form>

    <label for="first-name">Enter Your First Name:</label>
    <input type="text" id="first-name" name="first-name">

    <br><br>

    <label for="last-name">Enter Your Last Name:</label>
    <input type="text" id="last-name" name="last-name">

    <br><br>

    <label for="email">Enter Your Email:</label>
    <input type="email" id="email" name="email">

    <br><br>

    <label for="password">Create a New Password:</label>
    <input type="password" id="password" name="password">

    <br><br>

    <p>Account type (required)</p>

    <input type="radio" id="personal" name="account-type" value="personal">
    <label for="personal">Personal</label>

    <input type="radio" id="business" name="account-type" value="business">
    <label for="business">Business</label>

    <br><br>

    <label for="profile-picture">Upload a profile picture:</label>
    <input type="file" id="profile-picture" name="profile-picture">

    <br><br>

    <label for="age">Input your age (years):</label>
    <input type="number" id="age" name="age">

    <br><br>

    <label for="source">How did you hear about us?</label>
    <select id="source" name="source">
        <option value="">Select an option</option>
        <option value="internet">Internet</option>
        <option value="friend">Friend</option>
        <option value="social-media">Social Media</option>
    </select>

    <br><br>

    <label for="bio">Provide a bio:</label>
    <br>
    <textarea id="bio" name="bio"></textarea>

    <br><br>

    <input type="checkbox" id="terms" name="terms">
    <label for="terms">
        I accept the <a href="#">terms and conditions</a>
    </label>

    <br><br>

    <button type="submit">SUBMIT</button>

</form>

</body>

</html>
